name: Live data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -o netblocks .
      - name: Import RIR delegations
        run: ./netblocks -c "$RUNNER_TEMP/netblocks-cache" -i
      - name: Import ASN descriptions
        run: ./netblocks -c "$RUNNER_TEMP/netblocks-cache" -j
      - name: Query imported RIR data
        run: ./netblocks -c "$RUNNER_TEMP/netblocks-cache" -t US:ipv4 > /dev/null
      - name: Import MaxMind (optional)
        if: ${{ env.MAXMIND_LICENSE_KEY != '' }}
        run: ./netblocks -c "$RUNNER_TEMP/netblocks-cache" -m
